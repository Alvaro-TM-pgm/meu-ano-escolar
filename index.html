<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14223b">
  <meta name="description" content="Organize suas disciplinas e acompanhe suas notas sem criar conta.">
  <title>Meu Ano Escolar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="appShell" class="app-shell">
    <aside id="sidebar" class="sidebar">
      <a class="brand" href="#/dashboard"><img src="assets/logo.svg" alt=""><span>Meu Ano Escolar<small>SEU BOLETIM, MAIS SIMPLES</small></span></a>
      <nav id="nav" aria-label="Navegação principal"></nav>
      <div class="sidebar-bottom">
        <div class="sync-state"><i></i><span>Salvo neste navegador</span></div>
        <p class="sidebar-hint">Use Configurações para baixar uma cópia dos seus dados.</p>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button id="menuToggle" class="icon-button menu-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
        <div class="mobile-brand">Meu Ano Escolar</div>
        <div class="top-spacer"></div>
        <span class="local-pill"><i></i> Sem login · uso manual</span>
        <button class="button small help-button" data-route="guide">Como usar</button>
        <button id="themeToggle" class="icon-button" aria-label="Alternar tema" title="Alternar tema">☼</button>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
      <footer class="footer">Meu Ano Escolar <span>·</span> Os dados ficam salvos neste navegador. <button class="text-button" data-route="settings">Fazer backup</button></footer>
    </main>
  </div>
  <div id="modalLayer" class="modal-layer" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-header"><h2 id="modalTitle"></h2><button class="icon-button" data-close aria-label="Fechar">×</button></header><div id="modalBody"></div></section></div>
  <script type="module" src="js/app.js?v=3"></script>
  <script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));</script>
</body>
</html>
